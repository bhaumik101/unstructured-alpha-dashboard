name: Production confidence gate

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Compile and test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: dashboard
    env:
      PYTHONUNBUFFERED: "1"
      PYTHONDONTWRITEBYTECODE: "1"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            dashboard/requirements.txt
            dashboard/requirements-dev.txt

      - name: Install application and test dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements-dev.txt

      - name: Compile every Python module
        run: python -m compileall -q .

      - name: Audit production contracts
        run: python scripts/production_audit.py --json

      - name: Run full regression suite
        run: python -m pytest -q

  public-landing:
    name: Public landing lint and build
    runs-on: ubuntu-latest
    timeout-minutes: 12
    defaults:
      run:
        working-directory: dashboard/unstructured-alpha-web

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: dashboard/unstructured-alpha-web/package-lock.json

      - name: Install locked dependencies
        run: npm ci

      - name: Lint public landing
        run: npm run lint

      - name: Build public landing
        run: npm run build

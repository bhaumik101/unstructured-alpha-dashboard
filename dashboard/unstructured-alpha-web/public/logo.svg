<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-labelledby="title">
  <title id="title">Unstructured Alpha</title>
  <defs>
    <linearGradient id="ua-fill" x1="18%" y1="10%" x2="84%" y2="92%">
      <stop offset="0%" stop-color="#5fc4e8"/>
      <stop offset="52%" stop-color="#8b7cff"/>
      <stop offset="100%" stop-color="#d1b5ae"/>
    </linearGradient>
    <linearGradient id="ua-edge" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5fc4e8"/>
      <stop offset="100%" stop-color="#b5a7ff"/>
    </linearGradient>
    <filter id="ua-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <path
    d="M100 8 177 52v96l-77 44-77-44V52z"
    fill="#0d1018"
    stroke="url(#ua-edge)"
    stroke-width="4"
  />
  <path
    d="M100 25 161 60v80l-61 35-61-35V60z"
    fill="url(#ua-fill)"
    opacity="0.96"
    filter="url(#ua-glow)"
  />
  <text
    x="100"
    y="121"
    text-anchor="middle"
    font-family="Inter, Arial, sans-serif"
    font-size="62"
    font-weight="760"
    letter-spacing="-4"
    fill="#0a0b10"
  >UA</text>
</svg>
